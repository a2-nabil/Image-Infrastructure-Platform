apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-api
  labels:
    app: image-api
  annotations:
    # Replace ACCOUNT_ID / ROLE_NAME with your IRSA role that can read/write the S3 bucket.
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/image-api-s3
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/image-api-s3"
