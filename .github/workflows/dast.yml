name: DAST

on:
  workflow_run:
    workflows: ["Staging"]
    types: [completed]
    branches: [staging, develop]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to scan (e.g. https://staging.example.com)"
        required: true
        type: string

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            URL="${{ vars.STAGING_BASE_URL }}"
            if [ -z "$URL" ]; then
              echo "STAGING_BASE_URL variable is not set; skip DAST."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "url=$URL" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: ZAP baseline scan
        if: steps.target.outputs.skip != 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: true
        continue-on-error: false
      - name: Upload ZAP report
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
        continue-on-error: true
