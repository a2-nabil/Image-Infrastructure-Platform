name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  image-api:
    name: Image API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/image-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/image-api/go.mod
          cache-dependency-path: services/image-api/go.sum
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build -o /tmp/image-api ./cmd/server

  frontend:
    name: Object Identifier (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/object-identifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/object-identifier/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_IMAGE_API_URL: http://localhost:8080/api/v1
          GEMINI_API_KEY: ci-placeholder

  docker:
    name: Docker build (image-api)
    runs-on: ubuntu-latest
    needs: [image-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/image-api
          push: false
          tags: image-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
