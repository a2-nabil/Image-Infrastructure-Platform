name: SAST

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gosec:
    name: GoSec (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        working-directory: services/api
        run: |
          # -severity requires a value (low|medium|high). Fail the job on HIGH+.
          gosec -fmt=sarif -out=gosec.sarif -stdout -severity high -confidence medium ./...
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/api/gosec.sarif
          category: gosec
        continue-on-error: true

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit (critical+)
        run: npm audit --audit-level=critical

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/golang \
            --severity=ERROR \
            --error \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=apps/web/pnpm-lock.yaml \
            --sarif \
            --output=semgrep.sarif \
            services/api \
            apps/web/src
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true
