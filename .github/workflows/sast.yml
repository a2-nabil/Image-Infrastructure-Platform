name: SAST

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: GoSec (image-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/image-api/go.mod
          cache-dependency-path: services/image-api/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        working-directory: services/image-api
        run: |
          set +e
          gosec -fmt=sarif -out=gosec.sarif -stdout -severity ./...
          code=$?
          set -e
          exit $code
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/image-api/gosec.sarif
          category: gosec
        continue-on-error: true

  npm-audit:
    name: npm audit (object-identifier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/object-identifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/object-identifier/package-lock.json
      - run: npm ci
      - name: Audit (critical+)
        run: npm audit --audit-level=critical

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/golang \
            --config=p/javascript \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true
