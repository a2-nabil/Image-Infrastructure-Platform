[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Used by next.config.ts rewrites at build/runtime
  IMAGE_API_ORIGIN = "https://image-infrastructure-platform.onrender.com"
  # Same-origin API base so uploads + image <img src> use a2n-gallery.netlify.app
  NEXT_PUBLIC_IMAGE_API_URL = "/api/v1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy Image API through the Netlify domain (variant URLs, uploads, health under /api/v1).
# force=true so this wins over the Next handler for /api/v1/*.
[[redirects]]
  from = "/api/v1/*"
  to = "https://image-infrastructure-platform.onrender.com/api/v1/:splat"
  status = 200
  force = true
